services:
  postgres:
    image: postgres:16-alpine
    container_name: sind19mar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sind19mar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sind19mar_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-sind19mar}
    ports:
      - "5432:5432"
    volumes:
      - sind19mar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sind19mar} -d ${POSTGRES_DB:-sind19mar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sind19mar_postgres_data:
