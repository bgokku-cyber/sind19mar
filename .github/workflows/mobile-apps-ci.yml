name: Mobile Apps CI

on:
  pull_request:
    paths:
      - "apps/passenger/**"
      - "apps/driver/**"
      - ".github/workflows/mobile-apps-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/passenger/**"
      - "apps/driver/**"
      - ".github/workflows/mobile-apps-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck

  verify-expo-token:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is missing or unavailable."
            exit 1
          fi
      - name: Verify Expo account authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install --global eas-cli
          eas whoami

  link-eas-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Create or link the app's EAS project under the owner's personal Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install --global eas-cli
          eas init --account elmer658 --non-interactive --json
          echo "Resolved EAS configuration for apps/${{ matrix.app }}:"
          cat app.json
