name: Mobile Apps CI

on:
  pull_request:
    paths:
      - "apps/passenger/**"
      - "apps/driver/**"
      - ".github/workflows/mobile-apps-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/passenger/**"
      - "apps/driver/**"
      - ".github/workflows/mobile-apps-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Validate Expo configuration and dependencies
        run: npx expo-doctor

  verify-expo-token:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is missing or unavailable."
            exit 1
          fi
      - name: Verify Expo account authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install --global eas-cli
          eas whoami

  verify-eas-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Wait for the preview APK build to finish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install --global eas-cli
          eas project:info --non-interactive
          eas build --platform android --profile preview --non-interactive --no-wait
          for attempt in $(seq 1 24); do
            builds=$(eas build:list --platform android --build-profile preview --json --limit 1)
            build_id=$(echo "$builds" | jq -r '.[0].id // empty')
            status=$(echo "$builds" | jq -r '.[0].status // empty')
            artifact=$(echo "$builds" | jq -r '.[0].artifacts.buildUrl // empty')
            echo "App: ${{ matrix.app }} | Build: $build_id | Status: $status"
            if [ "$status" = "FINISHED" ]; then
              echo "APK ready: $artifact"
              exit 0
            fi
            if [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
              echo "::error::EAS build ended with status $status"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for EAS preview build."
          exit 1


  backend-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check API liveness and PostgreSQL readiness
        run: |
          for attempt in $(seq 1 6); do
            if curl --fail --silent --show-error https://sind19mar.onrender.com/api/health; then
              echo
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Backend liveness check failed."
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error https://sind19mar.onrender.com/api/health/ready
          echo
